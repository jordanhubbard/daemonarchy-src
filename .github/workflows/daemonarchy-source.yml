name: Daemonarchy source build controller

on:
  push:
    paths:
      - 'stand/lua/**'
      - 'stand/efi/loader/netconsole*'
      - 'stand/efi/loader/boottrace*'
      - 'stand/efi/loader/Makefile'
      - 'stand/common/dev_net.c'
      - 'stand/libsa/tftp.c'
      - 'stand/libsa/stand.h'
      - 'stand/efi/loader/main.c'
      - 'sys/dev/daemonarchy/**'
      - 'sys/modules/daemonarchy_earlynet/**'
      - 'sys/conf/files.amd64'
      - 'sys/conf/files'
      - 'sys/dev/usb/controller/generic_xhci*'
      - 'sys/dev/usb/controller/xhci.c'
      - 'sys/dev/usb/controller/xhci.h'
      - 'sys/dev/regulator/regulator.c'
      - 'sys/dev/regulator/regulator.h'
      - 'sys/dev/gpio/bcmstb_gpio.c'
      - 'sys/dev/gpio/gpiobus*'
      - 'sys/dev/gpio/ofw_gpiobus.c'
      - 'sys/dev/gpio/acpi_gpiobus.c'
      - 'sys/dev/gpio/gpioregulator.c'
      - 'sys/arm64/broadcom/bcm2712_pinctrl*'
      - 'sys/arm64/broadcom/bcmstb_reset.c'
      - 'sys/arm64/broadcom/bcm2712_mip.c'
      - 'sys/arm/arm/gic.c'
      - 'sys/arm/arm/gic_if.m'
      - 'sys/conf/files.arm64'
      - 'sys/dev/fdt/fdt_pinctrl.c'
      - 'sys/dev/fdt/fdt_pinctrl.h'
      - 'sys/dev/sdhci/sdhci_fdt_bcm2712.c'
      - 'sys/dev/sdhci/sdhci_bcm2712_policy.h'
      - 'sys/conf/options'
      - 'tools/daemonarchy/**'
      - 'sys/amd64/conf/DAEMONARCHY_DIAGNOSTIC'
      - 'sys/kern/kern_mbuf.c'
      - 'sys/net/debugnet.c'
      - 'sys/net/debugnet_int.h'
      - 'sys/gdb/netgdb.c'
      - 'sys/kern/daemonarchy_netconsole.c'
      - 'sys/net/iflib.c'
      - 'sys/sys/mbuf.h'
      - '.github/workflows/daemonarchy-source.yml'
  pull_request:
    paths:
      - 'stand/lua/**'
      - 'stand/efi/loader/netconsole*'
      - 'stand/efi/loader/boottrace*'
      - 'stand/efi/loader/Makefile'
      - 'stand/common/dev_net.c'
      - 'stand/libsa/tftp.c'
      - 'stand/libsa/stand.h'
      - 'stand/efi/loader/main.c'
      - 'sys/dev/daemonarchy/**'
      - 'sys/modules/daemonarchy_earlynet/**'
      - 'sys/conf/files.amd64'
      - 'sys/conf/files'
      - 'sys/dev/usb/controller/generic_xhci*'
      - 'sys/dev/usb/controller/xhci.c'
      - 'sys/dev/usb/controller/xhci.h'
      - 'sys/dev/regulator/regulator.c'
      - 'sys/dev/regulator/regulator.h'
      - 'sys/dev/gpio/bcmstb_gpio.c'
      - 'sys/dev/gpio/gpiobus*'
      - 'sys/dev/gpio/ofw_gpiobus.c'
      - 'sys/dev/gpio/acpi_gpiobus.c'
      - 'sys/dev/gpio/gpioregulator.c'
      - 'sys/arm64/broadcom/bcm2712_pinctrl*'
      - 'sys/arm64/broadcom/bcmstb_reset.c'
      - 'sys/arm64/broadcom/bcm2712_mip.c'
      - 'sys/arm/arm/gic.c'
      - 'sys/arm/arm/gic_if.m'
      - 'sys/conf/files.arm64'
      - 'sys/dev/fdt/fdt_pinctrl.c'
      - 'sys/dev/fdt/fdt_pinctrl.h'
      - 'sys/dev/sdhci/sdhci_fdt_bcm2712.c'
      - 'sys/dev/sdhci/sdhci_bcm2712_policy.h'
      - 'sys/conf/options'
      - 'tools/daemonarchy/**'
      - 'sys/amd64/conf/DAEMONARCHY_DIAGNOSTIC'
      - 'sys/kern/kern_mbuf.c'
      - 'sys/net/debugnet.c'
      - 'sys/net/debugnet_int.h'
      - 'sys/gdb/netgdb.c'
      - 'sys/kern/daemonarchy_netconsole.c'
      - 'sys/net/iflib.c'
      - 'sys/sys/mbuf.h'
      - '.github/workflows/daemonarchy-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: UNDI descriptor admission (not firmware execution)
        run: |
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -Istand/efi/loader \
            stand/efi/loader/netconsole_undi.c tools/daemonarchy/tests/netconsole-undi.c \
            -o "${{ runner.temp }}/undi-admission"
          "${{ runner.temp }}/undi-admission"
      - name: Bounded ACPI discovery parser (not firmware execution)
        run: |
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -Istand/efi/loader \
            stand/efi/loader/boottrace_acpi.c tools/daemonarchy/tests/boottrace-acpi.c \
            -o "${{ runner.temp }}/boottrace-acpi"
          "${{ runner.temp }}/boottrace-acpi"
      - name: BCM2712 bootstrap CFG and clock policy (not controller acceptance)
        run: |
          clang -std=c17 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -Isys/dev/sdhci \
            tools/daemonarchy/tests/bcm2712-sdhci-policy.c \
            -o "${{ runner.temp }}/bcm2712-sdhci-policy"
          "${{ runner.temp }}/bcm2712-sdhci-policy"
      - name: Checked FDT pinctrl faults (not native provider acceptance)
        run: |
          clang -std=c17 -D_DEFAULT_SOURCE -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Itools/daemonarchy/tests/fdt-pinctrl-stubs -idirafter sys \
            sys/dev/fdt/fdt_pinctrl.c tools/daemonarchy/tests/fdt-pinctrl-checked.c \
            -o "${{ runner.temp }}/fdt-pinctrl-checked"
          "${{ runner.temp }}/fdt-pinctrl-checked"
      - name: BCM2712 GPIO MMIO and provider faults (not hardware acceptance)
        run: |
          python3 tools/daemonarchy/tests/bcmstb-gpio-controls.py --cc clang --sanitize
          python3 tools/daemonarchy/tests/gpiobus-lifetime-controls.py --cc clang --sanitize
          python3 tools/daemonarchy/tests/pi5-sd-provider-controls.py --cc clang
      - name: BCM STB reset and calibration faults (not hardware acceptance)
        run: python3 tools/daemonarchy/tests/bcmstb-reset-controls.py --cc clang --sanitize
      - name: BCM2712 MIP and checked GIC ownership (not hardware acceptance)
        run: |
          python3 tools/daemonarchy/tests/bcm2712-mip-controls.py --cc clang --sanitize
          python3 tools/daemonarchy/tests/gic-checked-msi-controls.py --cc clang --sanitize
      - name: GPIO regulator producer lifetime (not native concurrency acceptance)
        run: python3 tools/daemonarchy/tests/run-regnode-lifetime.py --cc clang
      - name: ACPI USB DMA aperture and lifetime (not controller acceptance)
        run: python3 tools/daemonarchy/tests/xhci-acpi-dma.py --cc clang
      - name: Loader setup interactions (not EFI acceptance)
        run: >-
          python3 tools/daemonarchy/tests/run-loader-debug-setup.py
          --output-directory "${{ runner.temp }}/loader-setup-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: USB report preservation and failure controls
        run: |
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -Istand/efi/loader \
            tools/daemonarchy/tests/netconsole-report.c -o "${{ runner.temp }}/usb-report"
          "${{ runner.temp }}/usb-report"
      - name: Controller refusal and custody tests (not native acceptance)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tools/daemonarchy -p 'test_*.py' -v
      - name: Sanitized production mbuf ownership functions (not kernel acceptance)
        env:
          CC: clang
        run: >-
          python3 tools/daemonarchy/tests/run-debugnet-mbuf-pools.py
          --output-directory "${{ runner.temp }}/debugnet-pools-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Sanitized production iflib ownership callback (not kernel acceptance)
        env:
          CC: clang
        run: >-
          python3 tools/daemonarchy/tests/run-iflib-debugnet-ownership.py
          --output-directory "${{ runner.temp }}/iflib-debugnet-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Sanitized production receive-buffer class ownership (not kernel acceptance)
        env:
          CC: clang
        run: >-
          python3 tools/daemonarchy/tests/run-debugnet-rx-class.py
          --output-directory "${{ runner.temp }}/debugnet-rx-class-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Sanitized production debugnet duplicate-input suppression (not kernel acceptance)
        env:
          CC: clang
        run: >-
          python3 tools/daemonarchy/tests/run-debugnet-rx-duplicate.py
          --output-directory "${{ runner.temp }}/debugnet-rx-duplicate-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Sanitized production loader static network and TFTP port (not EFI acceptance)
        env:
          CC: clang
        run: >-
          python3 tools/daemonarchy/tests/run-loader-static-net.py
          --output-directory "${{ runner.temp }}/loader-static-net-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Sanitized production TFTP whole-file preload (not EFI acceptance)
        env:
          CC: clang
        run: >-
          python3 tools/daemonarchy/tests/run-tftp-preload.py
          --output-directory "${{ runner.temp }}/tftp-preload-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Sanitized production mountroot console output ring (not kernel acceptance)
        env:
          CC: clang
        run: >-
          python3 tools/daemonarchy/tests/run-netconsole-output.py
          --output-directory "${{ runner.temp }}/netconsole-output-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Early transport against simulated em and vtnet devices (not kernel acceptance)
        env:
          CC: clang
        run: >-
          python3 tools/daemonarchy/tests/run-earlynet-sim.py
          --output-directory "${{ runner.temp }}/earlynet-sim-${{ github.run_id }}-${{ github.run_attempt }}"

  native-loader:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Retain checkout identity before native synchronization
        run: |
          mkdir -p _build/earlynet-native
          git diff --exit-code
          git rev-parse HEAD > _build/earlynet-native/source-commit.txt
          git rev-parse 'HEAD^{tree}' > _build/earlynet-native/source-tree.txt
          sha256sum stand/efi/loader/netconsole*.c stand/efi/loader/netconsole*.h \
            stand/lua/netdebug.lua stand/lua/loader.lua stand/lua/menu.lua \
            stand/common/dev_net.c stand/libsa/tftp.c stand/libsa/stand.h \
            stand/efi/loader/main.c \
            sys/dev/daemonarchy/earlynet/*.c sys/dev/daemonarchy/earlynet/*.h \
            sys/modules/daemonarchy_earlynet/Makefile \
            tools/daemonarchy/tests/firmware-inventory.lua \
            > _build/earlynet-native/feature-inputs.sha256
      - name: Checkout exact upstream FreeBSD action
        uses: actions/checkout@v4
        with:
          repository: vmactions/freebsd-vm
          ref: c46abacb49f09938ca4e1702d15d836285d694cc
          path: _actions/freebsd-vm
          persist-credentials: false
      - name: Prepare verified official AnyVM release asset via GitHub API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _build/earlynet-native
          runtime=$(mktemp "$RUNNER_TEMP/anyvm-0.7.2.XXXXXX.py")
          trap 'rm -f "$runtime"' EXIT
          gh api -H 'Accept: application/octet-stream' \
            repos/anyvm-org/anyvm/releases/assets/589232152 > "$runtime"
          test "$(wc -c < "$runtime")" -eq 618865
          printf '%s  %s\n' \
            40a16e846bc07030759936d792343e770acdeb14d4c9991af7409648661a650d \
            "$runtime" | sha256sum --check --status
          python3 tools/daemonarchy/tests/test-freebsd-vm-bootstrap.py \
            --action-checkout _actions/freebsd-vm --runtime "$runtime" \
            2>&1 | tee _build/earlynet-native/bootstrap-controls.log
          python3 tools/daemonarchy/prepare-freebsd-vm-action.py \
            --action-directory _actions/freebsd-vm --runtime "$runtime" \
            --receipt _build/earlynet-native/bootstrap-action.json
      - name: Native FreeBSD EFI build and admission controls
        uses: ./_actions/freebsd-vm
        with:
          release: '15.0'
          arch: x86_64
          # Preserve the upstream default pair, sync mode and work-volume cache.
          sync: rsync
          cache-dir: '$HOME/work/_actions/_vmcache/freebsd-15.0-2.2.8-amd64-v3'
          mem: '4096'
          cpu: '2'
          run: |
            mkdir -p _build/earlynet-native
            result=0
            sh tools/daemonarchy/tests/build-earlynet-loader.sh \
              > _build/earlynet-native/run.stdout \
              2> _build/earlynet-native/run.stderr || result=$?
            printf '%s\n' "$result" > _build/earlynet-native/exit-status
      - name: Require successful native result
        run: test "$(cat _build/earlynet-native/exit-status)" = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earlynet-native-loader-${{ github.sha }}
          path: _build/earlynet-native/
