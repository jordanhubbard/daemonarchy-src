name: Native producer metadata smoke

on:
  pull_request:
    paths:
      - 'tools/daemonarchy/observe-unit-inputs.py'
      - 'tools/daemonarchy/test_observe_unit_inputs_native.py'
      - 'tools/daemonarchy/test_observe_unit_inputs.py'
      - '.github/workflows/producer-inputs-native.yml'
      - 'tools/daemonarchy/prepare-freebsd-vm-action.py'
      - 'tools/daemonarchy/tests/test-freebsd-vm-bootstrap.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/daemonarchy
            usr.bin/truncate
            share/mk
            sys/conf
            sys/sys
            tools/build/mk
      - name: Portable producer refusal and preservation controls
        run: python3 tools/daemonarchy/test_observe_unit_inputs.py -v
      - name: Emit production metadata command and exact tiny source inputs
        run: python3 tools/daemonarchy/test_observe_unit_inputs_native.py --emit-probe _build/producer-native
      - name: Checkout exact upstream FreeBSD action
        uses: actions/checkout@v4
        with:
          repository: vmactions/freebsd-vm
          ref: c46abacb49f09938ca4e1702d15d836285d694cc
          path: _actions/freebsd-vm
          persist-credentials: false
      - name: Prepare verified official AnyVM release asset via GitHub API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _build/producer-native
          runtime=$(mktemp "$RUNNER_TEMP/anyvm-0.7.2.XXXXXX.py")
          trap 'rm -f "$runtime"' EXIT
          gh api -H 'Accept: application/octet-stream' \
            repos/anyvm-org/anyvm/releases/assets/589232152 > "$runtime"
          test "$(wc -c < "$runtime")" -eq 618865
          printf '%s  %s\n' \
            40a16e846bc07030759936d792343e770acdeb14d4c9991af7409648661a650d \
            "$runtime" | sha256sum --check --status
          python3 tools/daemonarchy/tests/test-freebsd-vm-bootstrap.py \
            --action-checkout _actions/freebsd-vm --runtime "$runtime" \
            2>&1 | tee _build/producer-native/bootstrap-controls.log
          python3 tools/daemonarchy/prepare-freebsd-vm-action.py \
            --action-directory _actions/freebsd-vm --runtime "$runtime" \
            --receipt _build/producer-native/bootstrap-action.json
      - name: Actual hosted FreeBSD metadata only (no package installs or build targets)
        uses: ./_actions/freebsd-vm
        with:
          release: '15.0'
          arch: x86_64
          # Preserve the upstream default pair, sync mode and work-volume cache.
          sync: rsync
          cache-dir: '$HOME/work/_actions/_vmcache/freebsd-15.0-2.2.8-amd64-v3'
          mem: '2048'
          cpu: '2'
          run: |
            result=0
            /bin/sh _build/producer-native/probe.sh || result=$?
            printf '%s\n' "$result" > _build/producer-native/private/probe.exit
      - name: Validate actual native result with production decoder
        if: always()
        run: python3 tools/daemonarchy/test_observe_unit_inputs_native.py --verify-report _build/producer-native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: producer-native-smoke-${{ github.sha }}
          path: |
            _build/producer-native/summary.json
            _build/producer-native/bootstrap-action.json
            _build/producer-native/bootstrap-controls.log
          if-no-files-found: warn
