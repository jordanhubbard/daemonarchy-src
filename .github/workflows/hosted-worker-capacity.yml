name: Hosted x86 worker capacity

on:
  push:
    branches: [work/16-native-ci, work/16-native-ci-2604]
    paths:
      - '.github/workflows/hosted-worker-capacity.yml'
      - 'tools/daemonarchy/inspect-hosted-capacity.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-x86-capacity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect-capacity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Inspect host only; FreeBSD execution remains unrun
        run: python3 tools/daemonarchy/inspect-hosted-capacity.py _build/host-capacity.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: hosted-capacity-${{ matrix.os }}-${{ github.sha }}
          path: _build/host-capacity.json
          if-no-files-found: error
