name: Style Checker

# Runs my simple style(9) checker on pull requests.

on:
  pull_request: # maybe pull_request_target
    branches: [ main ]
    types: [ opened, reopened, edited, synchronize ]
    paths: [ '**.S', '**.c', '**.cc', '**.cpp', '**.h', '**.hh', '**.hpp' ]

permissions:
  contents: read

jobs:
  build:
    name: Style Checker
    runs-on: ubuntu-latest
    steps:
      # A PR commit count includes merged side branches. HEAD~count walks
      # only first parents and can select an unrelated, much older baseline.
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install packages
        run: |
          sudo apt-get update --quiet || true
          sudo apt-get -yq --no-install-suggests --no-install-recommends install perl
      - name: Run checker
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git cat-file -e "${PR_BASE}^{commit}"
          git cat-file -e "${PR_HEAD}^{commit}"
          echo "Checking PR commit range $PR_BASE..$PR_HEAD"
          tools/build/checkstyle9.pl --github "$PR_BASE..$PR_HEAD"
